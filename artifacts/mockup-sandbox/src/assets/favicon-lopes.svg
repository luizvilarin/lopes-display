<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo Gradiente Vermelho -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  
  <!-- O formato base do coração -->
  <path d="M128 256C128 174 194 128 256 128C318 128 384 174 384 256L256 384L128 256Z" fill="white" />
  
  <!-- Recorte circular/coração simplificado - Estilo Coração Lopes -->
